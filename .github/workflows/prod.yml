name: Deploy to production environment

on:
  push:
    branches: [main]
    paths:
      [
        'apps/auth/**',
        'apps/doctor/**',
        'apps/api-gateway/**',
        'apps/ocr/**',
        'apps/asr/**',
        'apps/cloud-storage/**',
        'apps/super-admin/**',
        '.github/workflows/aws.prod.yml',
        'package.json',
        'package-lock.json',
        'docker-compose.prod.yml',
        'nginx.conf',
        'rabbitmq.conf',
      ]

  pull_request:
    branches: [main]
    paths:
      [
        'apps/auth/**',
        'apps/doctor/**',
        'apps/api-gateway/**',
        'apps/ocr/**',
        'apps/asr/**',
        'apps/cloud-storage/**',
        'apps/super-admin/**',
        '.github/workflows/aws.prod.yml',
        'package.json',
        'package-lock.json',
        'docker-compose.prod.yml',
        'nginx.conf',
        'rabbitmq.conf',
      ]

  workflow_dispatch:

jobs:
  # JOB 1: TEST (Runs on PRs AND Pushes)
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Tests
        run: npm run test

  # JOB 2: BUILD AND PUSH IMAGES (Runs ONLY on Pushes)
  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build and Push Auth Service
      - name: Build and Push Auth
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/auth/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/auth-service:latest

      # Build and Push API Gateway
      - name: Build and Push API Gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api-gateway/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest

      # Build and Push Doctor Service
      - name: Build and Push Doctor
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/doctor/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/doctor-service:latest

      # Build and Push Ocr Service
      - name: Build and Push Ocr
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ocr/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ocr-service:latest

      # Build and Push Asr Service
      - name: Build and Push Asr
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/asr/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/asr-service:latest

      # Build and Push Cloud-Storage Service
      - name: Build and Push Cloud-Storage
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/cloud-storage/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/cloud-storage-service:latest
      
      # Build and Push Super-Admin Service
      - name: Build and Push Super-Admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/super-admin/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/super-admin-service:latest    

  # JOB 3: DEPLOY (Runs ONLY on Pushes)
  deploy:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Copy config files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'docker-compose.prod.yml,rabbitmq.conf,nginx.conf'
          target: '~/app'
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app
            docker compose -f docker-compose.prod.yml down            
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -af
  
  # JOB 4: HEALTH CHECKS (Runs ONLY after successful deploy)
  health-check:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for services to stabilize
        run: sleep 15

      - name: Check Auth Service
        run: |
          curl --fail --retry 5 --retry-delay 5 --retry-all-errors \
            https://${{ secrets.PROD_HOST }}/auth

      - name: Check API Gateway
        run: |
          curl --fail --retry 5 --retry-delay 5 --retry-all-errors \
            https://${{ secrets.PROD_HOST }}

      - name: Check Doctor Service
        run: |
          curl --fail --retry 5 --retry-delay 5 --retry-all-errors \
            https://${{ secrets.PROD_HOST }}/doctor

      - name: Check OCR Service
        run: |
          curl --fail --retry 5 --retry-delay 5 --retry-all-errors \
            https://${{ secrets.PROD_HOST }}/ocr

      - name: Check ASR Service
        run: |
          curl --fail --retry 5 --retry-delay 5 --retry-all-errors \
            https://${{ secrets.PROD_HOST }}/asr

      - name: Check Super Admin Service
        run: |
          curl --fail --retry 5 --retry-delay 5 --retry-all-errors \
            https://${{ secrets.PROD_HOST }}/super-admin

      - name: All health checks passed ✅
        run: echo "All services are healthy and running."