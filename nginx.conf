server {
    listen 127.0.0.1:80;
    server_name code-blue-apis.me www.code-blue-apis.me;
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 127.0.0.1:443 ssl;
    server_name code-blue-apis.me www.code-blue-apis.me;

    # Point to your new Let's Encrypt certificates
    ssl_certificate /etc/letsencrypt/live/code-blue-apis.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/code-blue-apis.me/privkey.pem;

    # Recommended SSL settings for security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        # Route traffic to your Docker container
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}